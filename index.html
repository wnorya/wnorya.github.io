<html lang="en">

  <meta charset="UTF-8">

  <title>BMHL 4v4 - 28-0 Challenge</title>
  <style>
    :root {
      --primary: #00ccff;
      --bg: #0a0a1f;
      --card: #112233;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: var(--bg);
      color: #ddd;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header { text-align: center; margin-bottom: 25px; }
    h1 {
      color: var(--primary);
      font-size: 2.8em;
      margin: 0;
      text-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
    }
    .container {
      display: flex;
      gap: 25px;
      max-width: 1400px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }
    .main {
      flex: 1;
      min-width: 380px;
      max-width: 520px;
    }
    .roster-container {
      max-height: 65vh;
      overflow-y: auto;
      padding-right: 10px;
      scrollbar-width: thin;
      scrollbar-color: #00ccff #223344;
    }
    .player {
      background: #223344;
      margin: 8px 0;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #00ccff22;
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player:hover {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(0, 204, 255, 0.4);
      transform: translateX(5px);
    }
    .player img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid #00ccff;
      object-fit: cover;
    }
    .sidebar {
      background: var(--card);
      padding: 25px;
      border-radius: 16px;
      border: 2px solid #00ccff33;
      width: 340px;
      height: fit-content;
    }
    .lines-container {
      width: 460px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .line {
      background: #1a2233;
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #00ccff44;
    }
    .line h3 {
      color: var(--primary);
      margin: 0 0 18px 0;
      text-align: center;
    }
    .formation {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .slot {
      width: 130px;
      background: #223344;
      border: 2px dashed #00ccff44;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      transition: all 0.2s;
    }
    .slot.filled {
      border-style: solid;
      border-color: #00ffcc;
      background: #1f2a44;
    }
    .slot .pos {
      color: #00ffcc;
      font-size: 0.95em;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .slot img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid #00ccff;
      object-fit: cover;
      margin-bottom: 6px;
    }
    button {
      padding: 14px 28px;
      font-size: 18px;
      background: var(--primary);
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px 4px;
      transition: 0.2s;
    }
    button:hover { background: #00ffcc; }
    button:disabled { background: #555; cursor: not-allowed; }
    #spinResult {
      font-size: 1.4em;
      min-height: 110px;
      margin: 15px 0;
      padding: 16px;
      background: #1a2233;
      border-radius: 12px;
      border-left: 6px solid var(--primary);
      text-align: center;
      transition: all 0.2s ease;
      font-family: monospace;
    }
    @keyframes pop {
      0% { transform: scale(0.6); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #112233;
      padding: 25px;
      border-radius: 16px;
      border: 2px solid var(--primary);
      max-width: 500px;
      text-align: center;
    }
    .stats {
      font-size: 0.85em;
      color: #00ffcc;
      margin-top: 4px;
      line-height: 1.3;
    }
    .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.7); 
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #b5b5b5;
    font-family: sans-serif;
    font-size: 1.5rem;
}
  </style>

// get headshot images from roblox
async function getAvatarHeadshotsByUserId(userIdsArray, imgSize) {
  let chunked = [];
  let results = [];

  let i = 0
  while (i < userIdsArray.length) {
    chunked.push(userIdsArray.slice(i, i + 100));
    i += 100;
  }

  for (let currentArrayChunk of chunked) {

    try {
      const response = await fetch(`https://thumbnails.rotunnel.com/v1/users/avatar-headshot?userIds=${currentArrayChunk.join(',')}&size=${imgSize}&format=Png`);
      
      if (!response.ok) throw new Error("thumbnail fetch error");

      const jsonResponse = await response.json();
      
      if (jsonResponse && jsonResponse.data) {
        results.push(...jsonResponse.data);
      }

    } catch (error) {
        console.error(`fuck you: ${error}`);
    }

  }
  
  return results;
};

async function updatePlayerImages() {
  // prepare array that stores userids, then chunks it into arrays of 100 because roblox will reject any request with >100 userids
  let listOfUserIds = [];

playersPool.forEach(player => {
    if (player.userid != null) listOfUserIds.push(player.userid); // if a player does not have a user id (Shits like evil chase) it will not add to the userid list because no user (Shits like Evil Chase) exist
});

  const headshotsGet = await getAvatarHeadshotsByUserId(listOfUserIds, "150x150");

  if (headshotsGet != []) { // image loading failed, meaning an empty array
    document.getElementById("loadingOverlayText").text = "Fetching images failed!"; 
    await wait(1000)
    document.getElementById("loadingOverlay").style.display = "none"; // turns off loading screen

  } else {
    await wait(1000)
    document.getElementById("loadingOverlay").style.display = "none"; // turns off loading screen
  }

  let headshotList = headshotsGet

for (const headshot of headshotList) {
      const targetPlayer = playersPool.find(p => p.userid.toString() === headshot.targetId.toString());
      
      if (targetPlayer) {
          targetPlayer.image = headshot.imageUrl;
      } else {
          console.warn(`targetid not found in playerpool: ${headshot.targetId}`);
      }
  };
};

await updatePlayerImages();

let myTeam = [];
let lines = { line1: [], line2: [], goalies: [] };
let teamName = "Your Dynasty";
let seasonStats = {};
let playoffsWon = false;

const ROSTER_MAX = 10;
const MAX_FORWARDS = 6;
const MAX_DEFENDERS = 2;
const MAX_GOALIES = 2;

let spinInterval = null;
let selectedPlayerIndex = null;

// ================== HELPERS ==================
function getDisplayName(player) {
  return player.name.toLowerCase();
}

function countAssignedByType() {
  let forwards = 0, defenders = 0, goalies = 0;
  Object.values(lines).flat().forEach(p => {
    if (!p) return;
    if (["LW","RW","FWD","C"].includes(p.position)) forwards++;
    else if (["D","LD","RD"].includes(p.position)) defenders++;
    else if (["G","GK"].includes(p.position)) goalies++;
  });
  return { forwards, defenders, goalies };
}

function calculateTeamStrength() {
  let total = 0, count = 0;
  Object.values(lines).flat().forEach(p => {
    if (p) {
      const mult = (["G","GK"].includes(p.position)) ? 1.25 : 
                   (lines.line1 || []).some(lp => lp && lp.name === p.name) ? 1.35 : 1.1;
      total += p.rating * mult;
      count++;
    }
  });
  return count > 0 ? Math.round(total / count) : 75;
}

function autoBestLineup() {
  if (myTeam.length < 6) return alert("Need at least 6 players for a full lineup!");

  lines = { line1: [], line2: [], goalies: [] };

  let goaliesList = myTeam.filter(p => ["G","GK"].includes(p.position)).sort((a,b) => b.rating - a.rating);
  let defendersList = myTeam.filter(p => ["D","LD","RD"].includes(p.position)).sort((a,b) => b.rating - a.rating);
  let forwardsList = myTeam.filter(p => ["LW","RW","FWD","C"].includes(p.position)).sort((a,b) => b.rating - a.rating);

  lines.goalies = goaliesList.slice(0, 2);
  lines.line1 = [forwardsList[0], forwardsList[1], forwardsList[2], defendersList[0]].filter(Boolean);
  lines.line2 = [forwardsList[3]||forwardsList[0], forwardsList[4]||forwardsList[1], forwardsList[5]||forwardsList[2], defendersList[1]||defendersList[0]].filter(Boolean);

  renderRoster();
  renderLines();
  alert("⭐ Best Lineup automatically assigned!");
}

// ================== SMART SPIN ==================
function spin() {
  if (myTeam.length >= ROSTER_MAX) return alert("Roster is full (10 players)!");
  
  const btn = document.getElementById("spinBtn");
  const resultDiv = document.getElementById("spinResult");
  const draftedNames = new Set(myTeam.map(p => p.name));
  let available = playersPool.filter(p => !draftedNames.has(p.name));

  if (available.length === 0) return alert("No players left!");

  const counts = countAssignedByType();
  const needsForward = counts.forwards < MAX_FORWARDS;
  const needsDefender = counts.defenders < MAX_DEFENDERS;
  const needsGoalie = counts.goalies < MAX_GOALIES;

  if (!needsForward) available = available.filter(p => !["LW","RW","FWD","C"].includes(p.position));
  if (!needsDefender) available = available.filter(p => !["D","LD","RD"].includes(p.position));
  if (!needsGoalie) available = available.filter(p => !["G","GK"].includes(p.position));

  let finalPool = available;
  const neededCount = [needsForward, needsDefender, needsGoalie].filter(x => x).length;

  if (neededCount === 1) {
    if (needsForward) finalPool = available.filter(p => ["LW","RW","FWD","C"].includes(p.position));
    else if (needsDefender) finalPool = available.filter(p => ["D","LD","RD"].includes(p.position));
    else if (needsGoalie) finalPool = available.filter(p => ["G","GK"].includes(p.position));
  }

  if (finalPool.length === 0) finalPool = available;

  btn.disabled = true;
  btn.textContent = "🎰 SPINNING...";

  let spinCount = 0;
  const maxSpins = 32;

  spinInterval = setInterval(() => {
    spinCount++;
    const randomPlayer = finalPool[Math.floor(Math.random() * finalPool.length)];
    
    resultDiv.innerHTML = `
      <span style="opacity:0.7;">🎰 SPINNING...</span><br><br>
      <strong style="font-size:1.7em;">${getDisplayName(randomPlayer)}</strong><br>
      <span style="color:#00ffcc;">${randomPlayer.position} • ${randomPlayer.rating} OVR</span>
    `;

    if (spinCount >= maxSpins) {
      clearInterval(spinInterval);
      const player = finalPool[Math.floor(Math.random() * finalPool.length)];
      myTeam.push(player);
      
      resultDiv.innerHTML = `
        <span style="color:#ffd700; font-size:2.1em; animation: pop 0.4s;">✅ DRAFTED!</span><br><br>
        <strong style="font-size:1.85em;">${getDisplayName(player)}</strong><br>
        <span style="color:#00ffcc;">${player.position} • ${player.rating} OVR</span><br>
        <small>from ${player.team}</small>
      `;

      renderRoster();
      btn.disabled = false;
      btn.textContent = "🎰 SPIN FOR PLAYER";
    }
  }, 55);
}

// ================== SEASON & PLAYOFFS ==================
function generateSeasonStats() {
  seasonStats = {};
  const allPlayers = Object.values(lines).flat().filter(Boolean);

  allPlayers.forEach(player => {
    const isGoalie = ["G","GK"].includes(player.position);
    if (isGoalie) {
      const svPct = (88 + Math.random() * 7).toFixed(1);
      const shutouts = Math.floor(Math.random() * 5);
      const gaa = (1.6 + Math.random() * 1.8).toFixed(2);
      seasonStats[player.name] = { svPct, shutouts, gaa };
    } else {
      const goals = Math.floor((player.rating - 65) / 3.5 + Math.random() * 15);
      const assists = Math.floor((player.rating - 60) / 3 + Math.random() * 16);
      seasonStats[player.name] = { goals, assists, points: goals + assists };
    }
  });
}

function simulateSeason() {
  if (lines.line1.length + lines.line2.length + lines.goalies.length < 6) {
    return alert("Assign more players to lines first!");
  }

  generateSeasonStats();
  const strength = calculateTeamStrength();
  let wins = 0, losses = 0, gf = 0, ga = 0;

  for (let game = 1; game <= 28; game++) {
    const opponentStrength = 78 + Math.floor(Math.random() * 18);
    const winChance = (strength - opponentStrength) * 1.8 + 48;
    const isWin = Math.random() * 100 < winChance;
    if (isWin) wins++; else losses++;
    const gameGF = Math.floor(Math.random() * 5) + 2;
    const gameGA = Math.floor(Math.random() * 5) + 1;
    gf += isWin ? gameGF : Math.max(0, gameGF - 1);
    ga += isWin ? Math.max(0, gameGA - 1) : gameGA;
  }

  const winPct = ((wins / 28) * 100).toFixed(1);
  const points = wins * 2;
  const summary = wins >= 22 ? "🏆 LEGENDARY SEASON!" : wins >= 18 ? "🔥 Championship Contenders!" : wins >= 14 ? "✅ Strong Season" : wins >= 10 ? "📈 Decent Year" : "📉 Rebuilding Year";

  let html = `
    <strong style="color:#ffd700; font-size:1.3em;">${teamName}</strong><br><br>
    Record: <strong>${wins} - ${losses}</strong><br>
    Win %: <strong>${winPct}%</strong> | Points: <strong>${points}</strong><br>
    GF: ${gf} | GA: ${ga} | Diff: <strong>${gf - ga}</strong><br><br>
    <span style="color:#00ffcc;">${summary}</span><br><br>
  `;

  // Top Scorers
  const skaters = Object.keys(seasonStats)
    .filter(name => {
      const p = myTeam.find(pl => pl.name === name);
      return p && !["G","GK"].includes(p.position);
    })
    .map(name => ({name, ...seasonStats[name]}))
    .sort((a,b) => b.points - a.points)
    .slice(0, 4);

  html += `<strong>Top Scorers:</strong><br>`;
  skaters.forEach(s => html += `${s.name}: <strong>${s.goals}G ${s.assists}A</strong> (${s.points} pts)<br>`);

  html += `<br><strong>Goalies:</strong><br>`;
  const goaliesList = Object.keys(seasonStats)
    .filter(name => {
      const p = myTeam.find(pl => pl.name === name);
      return p && ["G","GK"].includes(p.position);
    })
    .map(name => ({name, ...seasonStats[name]}));

  goaliesList.forEach(g => html += `${g.name}: <strong>${g.svPct}% SV</strong> • ${g.shutouts} SO • ${g.gaa} GAA<br>`);

  document.getElementById("seasonResults").innerHTML = html;
  document.getElementById("playoffsBtn").style.display = "inline-block";
  renderRoster();
  renderLines();
}

function simulatePlayoffs() {
  const strength = calculateTeamStrength();
  let seriesWins = 0;
  let seriesLosses = 0;
  let html = `<strong style="color:#ffd700; font-size:1.3em;">🏆 FINALS - BEST OF 7 🏆</strong><br><br>`;

  for (let game = 1; game <= 7; game++) {
    const opponentStrength = 88 + Math.floor(Math.random() * 12);
    const winChance = (strength - opponentStrength) * 1.5 + 42;
    const isWin = Math.random() * 100 < winChance;
    if (isWin) seriesWins++; else seriesLosses++;
    html += `Game ${game}: ${isWin ? "✅ WIN" : "❌ LOSS"}<br>`;
    if (seriesWins >= 4 || seriesLosses >= 4) break;
  }

  if (seriesWins >= 4) {
    html += `<br><span style="color:#ffd700; font-size:1.5em;">🏆 CHAMPIONS OF BMHL! 🏆</span>`;
  } else {
    html += `<br><span style="color:#ff6666;">Runner-up - Great Season!</span>`;
  }

  document.getElementById("seasonResults").innerHTML += `<br><br>${html}`;
  document.getElementById("playoffsBtn").style.display = "none";
}

// ================== REMAINING FUNCTIONS (assign, share, render, etc.) ==================
function showAssignModal(index) {
  selectedPlayerIndex = index;
  const player = myTeam[index];
  document.getElementById("modalPlayerName").textContent = `Assign ${getDisplayName(player)} (${player.position})`;

  const optionsDiv = document.getElementById("slotOptions");
  optionsDiv.innerHTML = "";

  const counts = countAssignedByType();
  const isGoalie = ["G", "GK"].includes(player.position);
  const isForward = ["LW", "RW", "FWD", "C"].includes(player.position);
  const isDefender = ["D", "LD", "RD"].includes(player.position);

  if (isGoalie) {
    if (counts.goalies >= MAX_GOALIES) optionsDiv.innerHTML = "<p style='color:#ff6666;'>Goalie slots are full!</p>";
    else {
      for (let i = 0; i < 2; i++) {
        if (!lines.goalies[i]) {
          const btn = document.createElement("button");
          btn.textContent = `Goalie Slot ${i+1}`;
          btn.onclick = () => assignToSlot('goalies', i);
          optionsDiv.appendChild(btn);
        }
      }
    }
  } else if (isForward) {
    if (counts.forwards >= MAX_FORWARDS) optionsDiv.innerHTML = "<p style='color:#ff6666;'>All Forward slots are full!</p>";
    else {
      ["line1", "line2"].forEach(lineKey => {
        const current = lines[lineKey] || [];
        for (let i = 0; i < 3; i++) {
          if (!current[i]) {
            const btn = document.createElement("button");
            btn.textContent = `${lineKey.toUpperCase()} - Forward Slot ${i+1}`;
            btn.onclick = () => assignToSlot(lineKey, i);
            optionsDiv.appendChild(btn);
          }
        }
      });
    }
  } else if (isDefender) {
    if (counts.defenders >= MAX_DEFENDERS) optionsDiv.innerHTML = "<p style='color:#ff6666;'>All Defense slots are full!</p>";
    else {
      ["line1", "line2"].forEach(lineKey => {
        const current = lines[lineKey] || [];
        if (!current[3]) {
          const btn = document.createElement("button");
          btn.textContent = `${lineKey.toUpperCase()} - Defense Slot`;
          btn.onclick = () => assignToSlot(lineKey, 3);
          optionsDiv.appendChild(btn);
        }
      });
    }
  }
  document.getElementById("assignModal").style.display = "flex";
}

function assignToSlot(lineKey, slotIndex) {
  const player = myTeam[selectedPlayerIndex];
  const alreadyUsed = Object.values(lines).flat().some(p => p && p.name === player.name);
  if (alreadyUsed) {
    alert("This player is already assigned!");
    closeModal();
    return;
  }
  if (!lines[lineKey]) lines[lineKey] = [];
  lines[lineKey][slotIndex] = player;
  closeModal();
  renderRoster();
  renderLines();
}

function closeModal() {
  document.getElementById("assignModal").style.display = "none";
  selectedPlayerIndex = null;
}

// Share / Load / Clear / Remove functions (same as before)
function shareTeam() {
  if (myTeam.length === 0) return alert("Build a team first!");
  const data = { teamName, myTeam, lines };
  const encoded = btoa(JSON.stringify(data));
  document.getElementById("shareCode").value = encoded;
  document.getElementById("shareModal").style.display = "flex";
}

function copyShareCode() {
  const ta = document.getElementById("shareCode");
  ta.select();
  document.execCommand("copy");
  alert("✅ Code copied to clipboard!");
}

function closeShareModal() { document.getElementById("shareModal").style.display = "none"; }
function showLoadModal() { document.getElementById("loadModal").style.display = "flex"; }
function closeLoadModal() { document.getElementById("loadModal").style.display = "none"; }

function loadTeam() {
  const code = document.getElementById("loadCode").value.trim();
  if (!code) return alert("Paste a code first!");
  try {
    const data = JSON.parse(atob(code));
    if (confirm(`Load team "${data.teamName}"?`)) {
      teamName = data.teamName || "Your Dynasty";
      document.getElementById("teamNameDisplay").textContent = teamName;
      myTeam = data.myTeam || [];
      lines = data.lines || { line1: [], line2: [], goalies: [] };
      seasonStats = {};
      renderRoster();
      renderLines();
      closeLoadModal();
      alert("✅ Team loaded successfully!");
    }
  } catch(e) { alert("❌ Invalid code!"); }
}

function setTeamName() {
  const input = document.getElementById("teamNameInput").value.trim();
  if (input) {
    teamName = input;
    document.getElementById("teamNameDisplay").textContent = teamName;
  }
}

function clearRoster() {
  if (confirm("Clear entire roster and reset season?")) {
    myTeam = [];
    lines = { line1: [], line2: [], goalies: [] };
    seasonStats = {};
    document.getElementById("playoffsBtn").style.display = "none";
    renderRoster();
    renderLines();
    document.getElementById("seasonResults").innerHTML = "Build your roster and simulate the season!";
  }
}

// ================== RENDERING (No X buttons) ==================
function renderRoster() {
  const teamDiv = document.getElementById("team");
  teamDiv.innerHTML = `<h3 style="color:var(--primary);">Roster: ${myTeam.length}/${ROSTER_MAX} (Click to assign)</h3>`;
  
  myTeam.forEach((player, index) => {
    const div = document.createElement("div");
    div.className = "player";
    div.onclick = () => showAssignModal(index);

    let statHTML = '';
    const stats = seasonStats[player.name];
    if (stats) {
      if (["G","GK"].includes(player.position)) {
        statHTML = `<div class="stats">SV%: ${stats.svPct} • SO: ${stats.shutouts} • GAA: ${stats.gaa}</div>`;
      } else {
        statHTML = `<div class="stats">${stats.goals}G ${stats.assists}A (${stats.points} pts)</div>`;
      }
    }

    div.innerHTML = `
      <img src="${player.image}" alt="${player.name}" onerror="this.src='https://via.placeholder.com/60/00ccff/000?text=${player.name[0]}'">
      <div style="flex:1; text-align:left;">
        <strong>${getDisplayName(player)}</strong><br>
        ${player.position} — ${player.rating} OVR<br>
        <small>${player.team}</small>
        ${statHTML}
      </div>
    `;
    teamDiv.appendChild(div);
  });
}

function renderLine(lineKey, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  let players = lines[lineKey] || [];
  const posLabels = ["LW", "C", "RW", "D"];
  for (let i = 0; i < 4; i++) {
    const slot = document.createElement("div");
    slot.className = "slot" + (players[i] ? " filled" : "");
    if (players[i]) {
      const p = players[i];
      const stats = seasonStats[p.name] || {};
      let statHTML = '';
      if (stats.goals !== undefined) statHTML = `<div class="stats">${stats.goals}G ${stats.assists}A</div>`; // goals are not undefined player is a skater
      else if (stats.svPct) statHTML = `<div class="stats">${stats.svPct}% • ${stats.shutouts} SO</div>`; // goals are undefined player is a goalie
      slot.innerHTML = `
        <div class="pos">${posLabels[i]}</div>
        <img src="${p.image}" onerror="this.src='https://via.placeholder.com/52/00ccff/000?text=${p.name[0]}'">
        <strong>${getDisplayName(p)}</strong><br>
        <small>${p.rating} OVR</small>
        ${statHTML}
      `;
    } else {
      slot.innerHTML = `<div class="pos">${posLabels[i]}</div><em style="color:#666;">Empty</em>`;
    }
    container.appendChild(slot);
  }
}

function renderGoalies() {
  const container = document.getElementById("goalies-formation");
  container.innerHTML = "";
  const players = lines.goalies || [];
  for (let i = 0; i < 2; i++) {
    const slot = document.createElement("div");
    slot.className = "slot" + (players[i] ? " filled" : "");
    if (players[i]) {
      const p = players[i];
      const stats = seasonStats[p.name] || {};
      let statHTML = stats.svPct ? `<div class="stats">${stats.svPct}% SV • ${stats.shutouts} SO</div>` : '';
      slot.innerHTML = `
        <div class="pos">G</div>
        <img src="${p.image}" onerror="this.src='https://via.placeholder.com/52/00ccff/000?text=${p.name[0]}'">
        <strong>${getDisplayName(p)}</strong><br>
        <small>${p.rating} OVR</small>
        ${statHTML}
      `;
    } else {
      slot.innerHTML = `<div class="pos">G</div><em style="color:#666;">Empty</em>`;
    }
    container.appendChild(slot);
  }
}

function renderLines() {
  renderLine("line1", "line1-formation");
  renderLine("line2", "line2-formation");
  renderGoalies();
}

// Initial render
renderRoster();
renderLines();

window.spin = spin;
window.autoBestLineup = autoBestLineup;
window.simulateSeason = simulateSeason;
window.simulatePlayoffs = simulatePlayoffs;
window.showAssignModal = showAssignModal;
window.assignToSlot = assignToSlot;
window.closeModal = closeModal;
window.shareTeam = shareTeam;
window.copyShareCode = copyShareCode;
window.closeShareModal = closeShareModal;
window.showLoadModal = showLoadModal;
window.closeLoadModal = closeLoadModal;
window.loadTeam = loadTeam;
window.setTeamName = setTeamName;
window.clearRoster = clearRoster;
</script>
